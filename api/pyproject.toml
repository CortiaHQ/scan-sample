[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-desk-api"
version = "0.3.1"
requires-python = ">=3.9,<3.10"
dependencies = [
    "fastapi==0.95.0",
    "starlette==0.26.1",
    "pydantic==1.10.2",
    "uvicorn==0.20.0",
    "requests==2.28.1",
    "urllib3==1.26.12",
    "Jinja2==3.1.2",
    "python-multipart==0.0.5",
    "cryptography==39.0.0",
    "PyYAML==6.0",
    "certifi==2022.12.7",
]

[project.optional-dependencies]
test = [
    "pytest==7.2.0",
    "httpx==0.23.3",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.uv]
exclude-newer = "2023-03-31T00:00:00Z"
